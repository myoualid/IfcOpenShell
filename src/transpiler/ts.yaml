      node: Name
      id: $name
    output: '{{ {"str":"string", "float":"number", "int":"number", "bool":"boolean", "DimensionalExponents":"array", "MEASURE_CLASS":"string", "QUANTITY_CLASS":"string"}.get(name, "unknown") }}'
  - input:
      node: Subscript
      value:
        node: Name
        id: Optional
      slice: $element
    output: '{{ element | emit("annotation_kinds") }}'
  # Union[X, None] is Optional[X].
  - input:
      node: Subscript
      value:
        node: Name
        id: Union
      slice:
        node: Tuple
        elts: $items
    when: items | length == 2 and items | selectattr("value", "defined") | selectattr("value", "none") | list | length == 1
    output: '{% for item in items if not (item.value is defined and item.value is none) %}{{ item | emit("annotation_kinds") }}{% endfor %}'
