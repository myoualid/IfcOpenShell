inference:
  # file._is_referenced_only_in(element, ids): a native method that gives a boolean.
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: _is_referenced_only_in
    when: value | kind == "file"
    output: boolean
  - input:
      node: Call
      func: $callee
    when: callee | source in inline_numpy
    output: boolean
  # dict.fromkeys(keys): a Dict for entity or number keys, an object for text keys.
  - input:
      node: Call
      func:
        node: Attribute
        value:
          node: Name
          id: dict
        attr: fromkeys
      args: $args
    when: args and args[0] | element_kind in ["entity", "number", "string"]
    output: '{{ "dict" if args[0] | element_kind == "string" else "map" }}'
  - input:
      node: Call
      func: $callee
    when: callee | runtime_path is not none
