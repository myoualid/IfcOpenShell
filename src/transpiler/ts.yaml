# Modules written by hand as a whole (module-level numpy data, for example): the generated module
# re-exports the target. `source` is transpile.source_hash of the whole Python module.
hand_written_modules:
  api.geometry.add_railing_representation: {module: helpers.railing, source: fdd2b8821a48}
hand_written_import: |-
  import { {{ name | camel }} } from "{{ "../" * (this_module.split(".") | length - 1) }}{{ target | replace(".", "/") }}.js";
  export { {{ name | camel }} };
# A method written by hand (key module.Class.method in hand_written): a function of the target module
# named ClassMethod, with `this` as its first, typed parameter.
hand_written_method: |-
  {{ "static " if static else "" }}{{ method | camel }} = {{ target | use(target | replace(".", "_")) }}.{{ cls }}{{ (method | camel)[:1] | upper }}{{ (method | camel)[1:] }};
# Functions whose types the rules cannot prove, so they stay stubs, with the reason.
unsupported_functions: {}
# Modules whose functions Python users replace at runtime; each gets an `overrides` object.
overridable: [api.owner.settings]
# A module value that cannot be translated is undefined; the functions that use it become stubs.
module_value_stubs: true
# Translate the methods of a class one by one: a method that cannot be translated becomes a stub, not its class.
method_stubs: true
# Declare locals where they are first bound, when their uses allow it.
inline_locals: true
# Take the kind of an expression from mypy_types when it is proven there.
proven_types: true
# Initializers Python treats as dynamic, so their locals are `any` rather than inferred: dicts and schema reflection.
dynamic_initializers: ['\(?\{', '.*\.declaration\(\)', '.*schemaByName\(', '.*declarationByName\(', '.*\.typeOfAttribute\(', '.*\.walk\(']
# JS reserved words that are valid Python names get a trailing underscore.
reserved: [new, class, function, var, default, delete, this, switch, case, const, let, enum, export, import, typeof, void, with, package, interface, private, protected, public, static, arguments, eval, instanceof, do, catch, extends, super, debugger, implements]
# Python modules with a hand-written counterpart in src/ts/ifcopenshell-js/src/helpers: `import x as y` and
# `from x import z` refer to `alias.member` of that module, with camelCase members.
# math has no module; its names map through math_functions and math_constants.
runtime_modules:
  math: {module: null}
  re: {module: null}
# Functions of the ifcopenshell-js geom module, which rules call since `import ifcopenshell.geom` binds no local name.
geom_functions:
  ifcopenshell.geom.create_shape: createShape
  ifcopenshell_wrapper.map_shape: mapShape
  ifcopenshell.ifcopenshell_wrapper.map_shape: mapShape
  ifcopenshell_wrapper.function_item_evaluator: functionItemEvaluator
  ifcopenshell.ifcopenshell_wrapper.function_item_evaluator: functionItemEvaluator
  ifcopenshell_wrapper.helmert_curve_point: helmertCurvePoint
  ifcopenshell.ifcopenshell_wrapper.helmert_curve_point: helmertCurvePoint
# Constants of ifcopenshell_wrapper that are values of geometry settings, in the ifcopenshell-js geom module.
geom_constants:
  CURVES: Dimensionality.CURVES
  SURFACES_AND_SOLIDS: Dimensionality.SURFACES_AND_SOLIDS
  CURVES_SURFACES_AND_SOLIDS: Dimensionality.CURVES_SURFACES_AND_SOLIDS
  TRIANGULATED: IteratorOutput.TRIANGULATED
  NATIVE: IteratorOutput.NATIVE
  SERIALIZED: IteratorOutput.SERIALIZED
# In modules importing these, operators and subscripts on values of unknown type are stubs, as the
# values may be dates (Temporal objects in TS).
overloading_modules: [datetime]
# Kind of values returned by runtime module functions; see `inference`.
runtime_kinds: {}
# numpy functions that return Python scalars or booleans rather than arrays.
numpy_scalars: [norm, dot, allclose, isclose, any, all, sum, min, max, mean, argmax, argmin, round, isnan, isinf, cos, sin, arctan, arcsin, arccos, radians, degrees, float64, float32, int64, int32]
# Python arithmetic operators and their runtime functions for overloaded operands.
dunder_operators:
  Add: add
  Sub: sub
  Mult: mul
  Div: truediv
  FloorDiv: floordiv
  Mod: mod
  Pow: pow
  MatMult: matmul
# Imported modules that rules translate (others are dropped and their users stubbed).
supported_modules: [math, json, time, functools, typing, collections, namedtuple, defaultdict, re, pathlib, assert_never, typing_extensions, dataclasses, dataclass, field, itertools, chain, logging, lark, datetime, relativedelta]
# Modules imported only for annotations.
type_only_modules: [typing, typing_extensions, collections.abc, __future__, collections, functools]
# Functions that introspect Python itself; generate.py runs them for each argument and
# the generated function looks the result up. Arguments must be strings.
precomputed:
  util.type.get_correct_type_assigned_rules: [IFC2X3, IFC4, IFC4X3, IFC4X3_ADD2]
precomputed_function: |
  const {{ name | camel }}Data: Record<string, any> = {{ data | literal }};

  /** Precomputed from Python by src/transpiler/generate.py for {{ data.keys() | join(", ") }}. */
  export function {{ name | camel }}({{ parameter }}: string): any {
    if (!({{ parameter }} in {{ name | camel }}Data)) throw new Error(`{{ name }}: no precomputed result for ${ {{- parameter -}} }`);
    return structuredClone({{ name | camel }}Data[{{ parameter }}]);
  }
# Decorators with no behaviour a caller can observe, other than caching.
ignored_decorators: [functools.cache, functools.lru_cache, cache, lru_cache, staticmethod]
# Python methods whose JS name or semantics differ; calls to them need an explicit rule.
python_methods: [pop, insert, sort, reverse, format, title, setdefault, values, items, keys, get, find, rfind, partition, zfill, center, ljust, rjust, isdigit, isalpha, isnumeric, swapcase, casefold, splitlines, encode, decode, clear, union, intersection, difference, issubset, issuperset, popitem, fromkeys, append, extend, copy, update, split, join, strip, lstrip, rstrip, upper, lower, replace, startswith, endswith, count, index, remove, add, discard]
operators:
  Add: +
  Sub: '-'
  Mult: '*'
  Div: /
  Pow: '**'
  Mod: '%'
  BitOr: '|'
  BitAnd: '&'
  FloorDiv: '/'
types:
  - input: null
    output: any
  # Dates: Temporal objects; a timedelta is a number of microseconds (Temporal, src/helpers/temporal.ts). A date hint
  # accepts a datetime too, as a Python datetime is a date.
  - input: $value
    when: value | source in ["datetime.datetime", "datetime.date", "datetime.time", "datetime", "date", "time"] and value | source not in classes
    output: '{% set name = (value | source).split(".")[-1] %}{% if name == "date" %}({{ "helpers.temporal" | use("temporal") }}.Temporal.PlainDate | {{ "helpers.temporal" | use("temporal") }}.Temporal.PlainDateTime){% else %}{{ "helpers.temporal" | use("temporal") }}.Temporal.Plain{{ {"datetime": "DateTime", "time": "Time"}[name] }}{% endif %}'
  - input: $value
    when: value | source in ["datetime.timedelta", "timedelta"]
    output: number
  - input:
      node: Subscript
      value: $array
    when: array | source in ["npt.NDArray", "NDArray"]
    output: any
  - input: $value
    when: value | source in ["npt.NDArray", "NDArray", "np.ndarray", "numpy.ndarray", "np.array"]
    output: any
  # Lark trees and tokens (Lark.js has the same attributes).
  - input: $value
    when: value | source in ["lark.Tree", "lark.Token"]
    output: any
  - input: $value
    when: value | source in ["npt.ArrayLike", "npt.DTypeLike"] or (value | source).startswith("ifcopenshell.geom.") or (value | source).startswith("ifcopenshell.ifcopenshell_wrapper.")
    output: any
  - input: $value
    when: value.__class__.__name__ == "Attribute" and value | is_class
    output: '{{ value | emit }}'
  - input: $value
    when: value | alias_value is not none and value.__class__.__name__ == "Attribute"
    output: '{{ value | alias_value | type }}'
  - input: $value
    when: value | runtime_path is not none and (value | runtime_path).module == "numpy"
    output: '{% set name = (value | runtime_path).parts[-1] %}{{ ("helpers.numpy" | use("np")) ~ ".NDArray" if name in ["ndarray", "NDArray", "array"] else "boolean" if name == "bool_" else "number" }}'
  - input: $value
    when: value | runtime_path is not none and (value | runtime_path).module in runtime_kinds
    output: '{% set path = value | runtime_path %}{% if runtime_modules[path.module].module is none %}{{ ("the type " ~ (value | source) ~ " (no TS type)") | unsupported }}{% else %}{{ runtime_modules[path.module].module | use(runtime_modules[path.module].alias) }}{% for part in path.parts %}.{{ part }}{% endfor %}{% endif %}'
  - input:
      node: Attribute
      value:
        node: Name
        id: ifcopenshell
      attr: file
    output: ifcopenshell.File
  - input:
      node: Attribute
      value:
        node: Name
        id: ifcopenshell
      attr: entity_instance
    output: ifcopenshell.EntityInstance
  - input:
      node: Name
      id: $name
    when: name not in module_globals and name not in classes and (node | is_class or node | alias_value is not none)
    output: '{% if node | is_class %}{{ node | emit }}{% else %}{{ node | alias_value | type }}{% endif %}'
  - input:
      node: Name
      id: $name
    # Names this module does not declare (TYPE_CHECKING imports such as mathutils.Vector, bare generics) are any.
    output: '{{ {"str": "string", "float": "number", "int": "number", "bool": "boolean", "Any": "any", "object": "any", "bytes": "Uint8Array", "entity_instance": "ifcopenshell.EntityInstance", "list": "any[]", "set": "Set<any>"}.get(name, name if name in module_globals or name in classes or name in typed_dicts else "any") }}'
  - input:
      node: Constant
      value: null
    output: 'null'
  - input:
      node: Constant
      value: $name
    output: '{{ name }}'
  - input:
      node: Subscript
      value:
        node: Name
        id: Optional
      slice: $element
    output: '{{ element | type }} | null'
  - input:
      node: Subscript
      value:
        node: Name
        id: $kind
      slice:
        node: Tuple
        elts: $elements
    when: kind in ['Union', 'Literal', 'tuple', 'dict']
    output: '{% if kind == "dict" %}{% if elements[0].id is defined and elements[0].id == "str" %}{ [key: string]: {{ elements[1] | type }} }{% elif elements[0] | emit("annotation_kinds") == "string" %}Partial<Record<{{ elements[0] | type }}, {{ elements[1] | type }}>>{% else %}Map<{{ elements[0] | type }}, {{ elements[1] | type }}>{% endif %}{% elif kind == "tuple" %}{% if elements[-1].value is defined and elements[-1].value.__class__.__name__ == "ellipsis" %}Array<{{ elements[0] | type }}>{% else %}[{{ elements | map("type") | join(", ") }}]{% endif %}{% else %}{% for element in elements %}{{ element | emit if kind == "Literal" else element | type }}{% if not loop.last %} | {% endif %}{% endfor %}{% endif %}'
  - input:
      node: Subscript
      value:
        node: Name
        id: Literal
      slice:
        node: Constant
        value: $value
    output: '{{ value | literal }}'
  - input:
      node: Subscript
      value:
        node: Name
        id: $kind
      slice: $element
    when: kind in ['set', 'Iterable', 'Sequence']
    output: '{{ "Set" if kind == "set" else "Iterable" if kind == "Iterable" else "Array" }}<{{ element | type }}>'
  - input:
      node: BinOp
      op:
        node: BitOr
      left: $left
      right: $right
    output: '{{ left | type }} | {{ right | type }}'
  - input:
      node: Attribute
      value:
        node: Name
        id: $module
      attr: $name
    when: module in ['entity_instance'] or name == 'entity_instance'
    output: ifcopenshell.EntityInstance
  - input:
      node: Attribute
    when: '"ifcopenshell_wrapper" in node | source or (node.value.id is defined and node.value.id | module_alias == "ifcopenshell_wrapper")'
    output: any
  - input:
      node: Subscript
      value:
        node: Name
        id: frozenset
      slice: $element
    output: ReadonlySet<{{ element | type }}>
  - input:
      node: Subscript
      value:
        node: Name
        id: $kind
      slice: $element
    when: kind in ['NotRequired', 'Required', 'ReadOnly']
    output: '{{ element | type }}'
  - input:
      node: Name
      id: entity_instance
    output: ifcopenshell.EntityInstance
  - input:
      node: Attribute
    when: node | resolve is not none
    output: any
  - input:
      node: Subscript
      value:
        node: Name
        id: list
      slice: $element
    output: Array<{{ element | type }}>
  - input:
      node: Subscript
      value:
        node: Name
        id: $kind
    when: kind in ['Any', 'Iterator', 'Generator', 'Callable']
    output: any
# Functions that return numpy arrays and are not written by hand: code that calls them is numpy code.
numpy_functions: [util.shape_builder.V]
# numpy calls that a rule writes inline for numbers (see the np.isclose rule).
inline_numpy: [np.isclose, np.allclose, numpy.isclose, numpy.allclose]
rules:
  # super().__init__() in a constructor.
  - input:
      node: Call
      func:
        node: Attribute
        value:
          node: Call
          func:
            node: Name
            id: super
          args: []
        attr: __init__
      args: $args
      keywords: []
    output: 'super({{ args | map("emit") | join(", ") }})'
  # np.isclose of two numbers and np.allclose of two literal tuples of numbers: |a - b| <= atol + rtol * |b|.
  # Other calls of them stay stubs (check_foreign lets the inline_numpy calls reach this rule).
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: $keywords
    when: callee | source in inline_numpy
    output: '{% set name = (callee | source).split(".")[-1] %}{% set a, b = (args + [none, none])[:2] %}{% set ok = args | length == 2 and keywords | rejectattr("arg", "in", ["atol", "rtol"]) | list | length == 0 and keywords | map(attribute="value") | rejectattr("__class__.__name__", "equalto", "Constant") | list | length == 0 and (name == "isclose" and a | kind == "number" and b | kind == "number" or name == "allclose" and a.elts is defined and b.elts is defined and a.elts | length == b.elts | length and (a.elts + b.elts) | map("kind") | reject("equalto", "number") | list | length == 0) %}{% if not ok %}{{ ("np." ~ name ~ " of values other than numbers or literal tuples of numbers") | unsupported }}{% endif %}{% set atol = (keywords | selectattr("arg", "equalto", "atol") | first).value.value if keywords | selectattr("arg", "equalto", "atol") | list else 1e-08 %}{% set rtol = (keywords | selectattr("arg", "equalto", "rtol") | first).value.value if keywords | selectattr("arg", "equalto", "rtol") | list else 1e-05 %}{% macro close(x, y) %}Math.abs(({{ x | emit }}) - ({{ y | emit }})) <= {{ atol }} + {{ rtol }} * Math.abs({{ y | emit }}){% endmacro %}({% if a.elts is defined %}{% for x in a.elts %}{{ close(x, b.elts[loop.index0]) }}{% if not loop.last %} && {% endif %}{% endfor %}{% else %}{{ close(a, b) }}{% endif %})'
  # A method of a module-level value of this module (a parser object, for example).
  - input:
      node: Call
      func:
        node: Attribute
        value:
          node: Name
          id: $name
        attr: $method
      args: $args
      keywords: []
    when: name in module_globals and name not in functions and name not in classes and name not in shadowed and not method.startswith("_") and node.func.value | kind in ["unknown", "object"]
    output: '{{ name | ident }}.{{ method | camel }}({{ args | map("emit") | join(", ") }})'
  # pattern.match(text), fullmatch and search: methods of a compiled pattern (str has none of them).
  - input:
      node: Call
      func:
        node: Attribute
        value: $pattern
        attr: $method
      args:
        - $text
      keywords: []
    when: method in ["match", "fullmatch", "search"] and pattern | runtime_path is none and pattern | resolve is none and pattern | kind in ["pattern", "unknown", "object", "string", "number", "scalar", "attribute"] and not (pattern.id is defined and pattern.id == "self")
    output: '{% set p = pattern | emit %}{% if method == "search" %}{{ p }}.exec({{ text | emit }}){% else %}new RegExp("^(?:" + {{ p }}.source + "){{ "$" if method == "fullmatch" }}", {{ p }}.flags).exec({{ text | emit }}){% endif %}'
  # Methods of a match object (a RegExpExecArray): unmatched groups are null, as Python gives None.
  - input:
      node: Call
      func:
        node: Attribute
        value: $match
        attr: $method
      args: $args
      keywords: []
    when: match | kind == "match" and method in ["group", "groups", "start", "end", "span"]
    output: '{% set m = match | emit %}{% if method == "group" and (not args or args[0].__class__.__name__ == "Constant" and args[0].value == 0) %}{{ m }}[0]{% elif method == "group" and args | length == 1 and args[0].__class__.__name__ == "Constant" and args[0].value is integer %}({{ m }}[{{ args[0].value }}] ?? null){% elif method == "group" and args | length == 1 and args[0].__class__.__name__ == "Constant" and args[0].value is string %}({{ m }}.groups?.[{{ args[0].value | literal }}] ?? null){% elif method == "groups" and not args %}{{ m }}.slice(1).map((g: string | undefined) => g ?? null){% elif method == "start" and not args %}{{ m }}.index{% elif method == "end" and not args %}({{ m }}.index + {{ m }}[0].length){% elif method == "span" and not args %}[{{ m }}.index, {{ m }}.index + {{ m }}[0].length]{% else %}{{ ("match." ~ method ~ "() in this form") | unsupported }}{% endif %}'
  # str.title(): each run of letters starts with a capital, the rest is lower case.
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: title
      args: []
      keywords: []
    when: value | kind == "string"
    output: '{{ value | emit }}.toLowerCase().replace(/(^|[^a-z])([a-z])/g, (_m: string, before: string, letter: string) => before + letter.toUpperCase())'
  # filter(function, items): an array, which iterates as Python's filter object does.
  - input:
      node: Call
      func:
        node: Name
        id: filter
      args:
        - $function
        - $items
      keywords: []
    when: '"filter" not in shadowed and not (function.__class__.__name__ == "Constant" and function.value is none)'
    output: 'Array.from<any>({{ items | iterable }}).filter({{ function | emit }})'
  # An exception class with no body of its own: an Error subclass with the class name as its name.
  - input:
      node: ClassDef
      name: $name
      bases:
        - $base
      keywords: []
      body: $body
      decorator_list: []
    when: base | source in ["Exception", "ValueError", "RuntimeError", "TypeError", "KeyError"] and body | rejectattr("__class__.__name__", "in", ["Pass", "Expr"]) | list | length == 0
    output: '{% if top_level %}export {% endif %}class {{ name }} extends Error { override name = {{ name | literal }}; }'
  # text * n: String.prototype.repeat.
  - input:
      node: BinOp
      left: $left
      op:
        node: Mult
      right: $right
    when: left | kind == "string" and right | kind == "number" or left | kind == "number" and right | kind == "string"
    output: '{% if left | kind == "string" %}{{ left | emit }}.repeat({{ right | emit }}){% else %}{{ right | emit }}.repeat({{ left | emit }}){% endif %}'
  - input:
      node: Call
      func: $callee
    when: callee | resolve in numpy_functions
    output: '{{ ("calls " ~ (callee | resolve) ~ ", which returns a numpy array") | unsupported }}'
  # m[i, j] and m[:, j] index numpy arrays; they need the hand-written TypedArray code (see hand_written).
  - input:
      node: Subscript
      slice:
        node: Tuple
    output: '{{ "numpy indexing (a tuple index)" | unsupported }}'
  # Python indexes an entity by attribute position: entity[0] is its first attribute.
  - input:
      node: Subscript
      value: $value
      slice: $index
    when: node.ctx.__class__.__name__ == "Load" and value | kind == "entity" and index.__class__.__name__ == "Constant" and index.value is integer and index.value >= 0
    output: '({{ value | emit }}.get({{ index.value }}) as any)'
  # lark.Lark(grammar, parser="lalr"): a Lark.js parser that generate.py makes from the same grammar.
  - input:
      node: Call
      func: $callee
      args:
        - $grammar
      keywords:
        - node: keyword
          arg: parser
          value:
            node: Constant
            value: lalr
    when: callee | source in ["lark.Lark", "Lark"] and grammar.__class__.__name__ == "Constant"
    output: '{% if not lark_js %}{{ "lark-js is not installed" | unsupported }}{% endif %}{{ grammar | lark_parser }}.get_parser()'
  # Other Lark parsers (Earley, or a grammar that is not a literal) have no Lark.js counterpart.
  - input:
      node: Call
      func: $callee
    when: callee | source in ["lark.Lark", "Lark"]
    output: '{{ "Lark.js needs a literal grammar with the LALR parser" | unsupported }}'
  # itertools.chain(*lists): the items of each list, in order.
  - input:
      node: Call
      func: $callee
      args:
        - node: Starred
          value: $lists
      keywords: []
    when: callee | source in ["itertools.chain", "chain"]
    output: 'Array.from<any>({{ lists | iterable }}).flatMap((v: any) => [...v])'
  # itertools.chain(a, b): one array with the items of a and then of b.
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: []
    when: callee | source in ["itertools.chain", "chain"] and args | selectattr("__class__.__name__", "equalto", "Starred") | list | length == 0
    output: '[{% for arg in args %}...{{ arg | iterable }}{% if not loop.last %}, {% endif %}{% endfor %}]'
  # Schema declarations are not downcast: methods of one declaration class need an explicit cast.
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: enumeration_items
      args: []
      keywords: []
    when: not (value.__class__.__name__ == "Call" and value.func.attr is defined and value.func.attr == "as_enumeration_type")
    output: '{{ value | emit }}.asEnumerationType().enumerationItems()'
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: select_list
      args: []
      keywords: []
    when: not (value.__class__.__name__ == "Call" and value.func.attr is defined and value.func.attr == "as_select_type")
    output: '{{ value | emit }}.asSelectType().selectList()'
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: type_of_element
      args: []
      keywords: []
    when: not (value.__class__.__name__ == "Call" and value.func.attr is defined and value.func.attr == "as_aggregation_type")
    output: '{{ value | emit }}.asAggregationType().typeOfElement()'
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: type_of_aggregation_string
      args: []
      keywords: []
    when: not (value.__class__.__name__ == "Call" and value.func.attr is defined and value.func.attr == "as_aggregation_type")
    output: '{{ value | emit }}.asAggregationType().typeOfAggregationString()'
  # Dates: datetime, date and time are Temporal objects; a timedelta is a number
  # of microseconds, so duration arithmetic stays plain number arithmetic.
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: $keywords
    when: callee | source in ["datetime.timedelta", "timedelta"]
    output: '{% set units = {"weeks": "604800000000", "days": "86400000000", "hours": "3600000000", "minutes": "60000000", "seconds": "1000000", "milliseconds": "1000", "microseconds": "1"} %}{% set names = ["days", "seconds", "microseconds", "milliseconds", "minutes", "hours", "weeks"] %}Math.round({% for a in args %}({{ a | emit }}) * {{ units[names[loop.index0]] }} + {% endfor %}{% for k in keywords %}({{ k.value | emit }}) * {{ units[k.arg] }} + {% endfor %}0)'
  - input:
      node: Call
      func: $callee
      args: []
      keywords: []
    when: callee | source in ["datetime.datetime.now", "datetime.now"]
    output: '{{ "helpers.temporal" | use("temporal") }}.Temporal.Now.plainDateTimeISO()'
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: []
    when: callee | source in ["datetime.datetime.combine", "datetime.combine"] and args | length >= 1
    output: '{{ "helpers.temporal" | use("temporal") }}.Temporal.PlainDate.from({{ args[0] | emit }}).toPlainDateTime({{ args[1] | emit if args | length > 1 else "new " ~ ("helpers.temporal" | use("temporal")) ~ ".Temporal.PlainTime()" }})'
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: []
    when: callee | source in ["datetime.datetime.fromisoformat", "datetime.fromisoformat"]
    output: '{{ "helpers.temporal" | use("temporal") }}.Temporal.PlainDateTime.from({{ args[0] | emit }})'
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: []
    when: callee | source in ["datetime.date.fromisoformat", "date.fromisoformat"]
    output: '{{ "helpers.temporal" | use("temporal") }}.Temporal.PlainDate.from({{ args[0] | emit }})'
  - input:
      node: Call
      func: $callee
      args: $args
      keywords: []
    when: callee | source in ["datetime.date", "datetime.time", "datetime.datetime"] or (callee | source in ["date", "time", "datetime"] and callee | source not in functions)
    output: '{% set name = (callee | source).split(".")[-1] %}{% set head = 3 if name == "datetime" else 0 %}{% if name == "date" %}new {{ "helpers.temporal" | use("temporal") }}.Temporal.PlainDate({{ args | map("emit") | join(", ") }}){% else %}new {{ "helpers.temporal" | use("temporal") }}.Temporal.Plain{{ "DateTime" if name == "datetime" else "Time" }}({{ args[:head + 3] | map("emit") | join(", ") }}{% if args | length > head + 3 %}, Math.floor(({{ args[head + 3] | emit }}) / 1000), ({{ args[head + 3] | emit }}) % 1000{% endif %}){% endif %}'
  - input:
      node: BinOp
      left: $left
      op: $op
      right: $right
    when: op.__class__.__name__ == "Sub" and left | kind in ['datetime', 'date'] and right | kind in ['datetime', 'date']
    output: '{% if left | kind == "datetime" and right | kind == "datetime" %}{{ right | emit }}.until({{ left | emit }}, { largestUnit: "hours" }).total({ unit: "microseconds" }){% elif left | kind == "date" and right | kind == "date" %}({{ right | emit }}.until({{ left | emit }}).days * 86400000000){% else %}{{ "a date minus a datetime" | unsupported }}{% endif %}'
  - input:
      node: BinOp
      left: $left
      op: $op
      right: $right
    when: op.__class__.__name__ in ["Add", "Sub"] and left | kind in ['datetime', 'date']
    output: '{% set sign = "" if op.__class__.__name__ == "Add" else "-" %}{% if right | kind != "number" %}{{ "a date plus or minus a value that is not a duration" | unsupported }}{% elif left | kind == "datetime" %}{{ left | emit }}.add({ microseconds: {{ sign }}({{ right | emit }}) }){% else %}{{ left | emit }}.add({ days: Math.floor({{ sign }}({{ right | emit }}) / 86400000000) }){% endif %}'
  - input:
      node: BinOp
      left: $left
      op:
        node: Add
      right: $right
    when: right | kind in ['datetime', 'date']
    output: '{% if left | kind != "number" %}{{ "a date plus a value that is not a duration" | unsupported }}{% elif right | kind == "datetime" %}{{ right | emit }}.add({ microseconds: {{ left | emit }} }){% else %}{{ right | emit }}.add({ days: Math.floor(({{ left | emit }}) / 86400000000) }){% endif %}'
  - input:
      node: AugAssign
      target: $target
      op: $op
      value: $value
    when: op.__class__.__name__ in ["Add", "Sub"] and target | kind in ['datetime', 'date']
    output: '{% set sign = "" if op.__class__.__name__ == "Add" else "-" %}{% if value | kind != "number" %}{{ "a date plus or minus a value that is not a duration" | unsupported }}{% elif target | kind == "datetime" %}{{ target | emit }} = {{ target | emit }}.add({ microseconds: {{ sign }}({{ value | emit }}) });{% else %}{{ target | emit }} = {{ target | emit }}.add({ days: Math.floor({{ sign }}({{ value | emit }}) / 86400000000) });{% endif %}'
  - input:
      node: Compare
      left: $left
      ops:
        - $op
      comparators:
        - $right
    when: op.__class__.__name__ in ["Lt", "LtE", "Gt", "GtE", "Eq", "NotEq"] and (left | kind in ['datetime', 'date'] or right | kind in ['datetime', 'date'])
    output: '{% set ops = {"Lt": "<", "LtE": "<=", "Gt": ">", "GtE": ">=", "Eq": "===", "NotEq": "!=="} %}{% set with_none = left.__class__.__name__ == "Constant" and left.value is none or right.__class__.__name__ == "Constant" and right.value is none %}{% set kinds = [left | kind, right | kind] %}{% if with_none %}({{ left | emit }} {{ ops[op.__class__.__name__] }} {{ right | emit }}){% elif kinds == ["datetime", "datetime"] or kinds == ["date", "date"] %}({{ "helpers.temporal" | use("temporal") }}.Temporal.Plain{{ "DateTime" if kinds[0] == "datetime" else "Date" }}.compare({{ left | emit }}, {{ right | emit }}) {{ ops[op.__class__.__name__] }} 0){% else %}{{ "a comparison of a date with a datetime or a value of unknown type" | unsupported }}{% endif %}'
  - input:
      node: Attribute
      value: $value
      attr: $name
    when: name in ["days", "seconds", "microseconds"] and value | kind == "number"
    output: '{% set x = value | emit %}{% if name == "days" %}Math.floor({{ x }} / 86400000000){% elif name == "seconds" %}Math.floor(((({{ x }}) % 86400000000) + 86400000000) % 86400000000 / 1000000){% else %}((({{ x }}) % 1000000) + 1000000) % 1000000{% endif %}'
