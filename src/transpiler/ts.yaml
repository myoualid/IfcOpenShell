    when: value.__class__.__name__ in ["Name", "Attribute"] and value | runtime_path is not none
    output: '{% set path = value | runtime_path %}{{ "number" if path.module == "math" or path.module == "numpy" and path.parts[-1] in ["pi", "e", "inf", "nan"] else "unknown" }}'
  - input:
      node: Name
      id: $name
    output: '{{ symbols.get(name, "unknown") }}'
  - input:
      node: Attribute
      value:
        node: Name
        id: self
      attr: $attr
    when: ("self." ~ attr) in symbols
    output: '{{ symbols["self." ~ attr] }}'
  # Values of annotated dicts: d.get(k), d.setdefault(k, v), d[k], at any depth.
  - input: $value
    when: value.__class__.__name__ in ["Call", "Subscript"] and value | path in symbols
    output: '{{ symbols[value | path] }}'
  - input:
      node: Constant
      value: $value
    output: '{{ "string" if value is string else "boolean" if value is boolean else "number" if value is number else "unknown" }}'
  - input:
      node: BinOp
      left: $left
      op: $op
      right: $right
    when: op.__class__.__name__ in dunder_operators and (left | kind in ["ndarray", "pyobject"] or right | kind in ["ndarray", "pyobject"])
    output: '{{ "ndarray" if "ndarray" in [left | kind, right | kind] else "pyobject" }}'
  - input:
      node: UnaryOp
      op:
        node: USub
      operand: $value
    when: value | kind in ["ndarray", "pyobject", "number"]
    output: '{{ value | kind }}'
  - input:
      node: Attribute
      value: $value
      attr: $attr
    when: attr in ["T", "real", "imag"] and value | kind == "ndarray"
    output: ndarray
  - input:
      node: Subscript
      value: $value
      slice: $index
    when: value | kind == "ndarray" and (index.__class__.__name__ == "Slice" or index.__class__.__name__ == "Tuple" and index.elts | selectattr("__class__.__name__", "equalto", "Slice") | list)
    output: ndarray
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: $method
    when: value | kind in ["ndarray", "pyobject"]
    output: '{% if value | kind == "ndarray" %}{{ "array" if method == "tolist" else "ndarray" if method in ["copy", "reshape", "flatten", "ravel", "transpose", "astype", "round", "cross", "clip"] else "unknown" }}{% else %}{{ "string" if method in ["isoformat", "strftime", "isoformat", "ctime"] else "number" if method in ["timestamp", "total_seconds", "weekday", "isoweekday", "toordinal"] else "pyobject" if method in ["date", "time", "replace", "combine", "astimezone", "now", "today"] else "unknown" }}{% endif %}'
  - input: $value
    when: value is not none and value.__class__.__name__ in ["List", "Tuple", "ListComp", "GeneratorExp"]
    output: array
  - input:
      node: Dict
      keys: $keys
    when: keys and (keys | reject("none") | selectattr("__class__.__name__", "equalto", "Tuple") | list or keys | reject("none") | map("kind") | select("in", ["entity", "number"]) | list)
    output: map
  - input:
      node: DictComp
      key: $key
    when: key.__class__.__name__ == "Tuple" or key | kind in ["entity", "number"]
    output: map
  - input:
      node: Call
      func:
        node: Name
        id: defaultdict
    output: map
  - input: $value
    when: value is not none and value.__class__.__name__ in ["Dict", "DictComp"]
    output: dict
  - input:
      node: NamedExpr
      value: $value
    output: '{{ value | kind }}'
  - input:
      node: Call
      func:
        node: Name
        id: $name
    when: name in classes
    output: class:{{ name }}
  - input:
      node: Call
      func: $callee
    when: callee.__class__.__name__ in ["Name", "Attribute"] and callee | is_class
    output: class:{{ callee | resolve }}
  - input:
      node: Call
      func:
        node: Name
        id: $name
    when: name in ["hasattr", "isinstance", "bool", "len", "int", "float", "set", "sum", "sorted", "all", "any", "round", "frozenset"]
    output: '{{ {"hasattr": "boolean", "isinstance": "boolean", "bool": "boolean", "len": "number", "int": "number", "float": "number", "set": "set", "sum": "number", "sorted": "array", "all": "boolean", "any": "boolean", "round": "number", "frozenset": "set"}[name] }}'
  - input:
      node: Call
      func:
        node: Attribute
        attr: $method
      args: $args
    when: method in ["is_a", "get_inverse", "startswith", "endswith", "id", "get_total_inverses", "create_entity", "get_info"] or method.startswith("createIfc")
    output: '{{ "string" if method == "is_a" and not args else "boolean" if method in ["is_a", "startswith", "endswith"] else "set" if method == "get_inverse" else "number" if method in ["id", "get_total_inverses"] else "dict" if method == "get_info" else "entity" }}'
  - input: $value
    when: value.__class__.__name__ in ["Compare", "UnaryOp"] and (value.__class__.__name__ == "Compare" or value.op.__class__.__name__ == "Not")
    output: boolean
  - input: $value
    when: value.__class__.__name__ in ["Set", "SetComp"]
    output: set
  - input:
      node: BinOp
      left: $left
      op: $op
      right: $right
    when: op.__class__.__name__ in ["BitOr", "Sub", "BitAnd"] and (left | kind == "set" or right | kind == "set")
    output: set
  - input:
      node: BinOp
      left: $left
      op:
        node: Add
      right: $right
    when: left | kind == "array" or right | kind == "array"
    output: array
  - input: $value
    when: value.__class__.__name__ == "JoinedStr"
    output: string
  - input:
      node: BoolOp
      values: $values
    output: '{{ values[-1] | kind }}'
  - input:
      node: Attribute
      attr: units
    output: dict
  - input:
      node: Attribute
      attr: $attr
    when: attr in ["Units", "Elements", "DefiningValues", "DefinedValues"]
    output: array
  - input:
      node: Call
      func:
        node: Attribute
        attr: $method
    when: method in ["by_type", "keys", "items", "upper", "lower", "replace", "capitalize", "join"]
    output: '{{ "array" if method in ["by_type", "keys", "items"] else "string" }}'
  - input:
      node: Call
      func: $callee
    when: callee | signature is not none and (callee | signature).returns is not none
    output: '{{ (callee | signature).returns | emit("annotation_kinds") }}'
  - input:
      node: Call
      func:
        node: Name
        id: $name
    when: name in ["tuple", "list", "range", "str"]
    output: '{{ "array" if name in ["tuple", "list", "range"] else "string" }}'
  # entity[i]: a forward attribute value read by position.
  - input:
      node: Subscript
      value: $value
      slice: $index
    when: value | kind == "entity" and (index.__class__.__name__ == "Constant" and index.value is integer and index.value >= 0 or index.__class__.__name__ != "Constant" and index | kind == "number")
    output: attribute
  # A call of a function of this module with no return annotation: the kind of its return values.
  - input:
      node: Call
      func: $callee
    when: callee | inferred_return != "unknown"
    output: '{{ callee | inferred_return }}'
  # Paths are text (see pathlib.Path in the rules).
  - input:
      node: Call
      func: $callee
    when: callee | source in ["pathlib.Path", "Path"]
    output: path
  - input:
      node: Attribute
      value: $value
      attr: parent
    when: value | kind == "path"
    output: path
  - input:
      node: Call
      func:
        node: Attribute
        value: $value
        attr: $method
    when: method in ["absolute", "resolve", "joinpath"] and value | kind == "path"
    output: path
  # Lark trees, in modules that use Lark: children is a list, data the rule name.
  - input:
      node: Attribute
      value: $value
      attr: $attr
    when: attr in ["children", "data"] and "lark" in imported_modules and value | kind == "unknown"
    output: '{{ "array" if attr == "children" else "string" }}'
  # getattr(entity, name) with a name that is not literal: an attribute value of the entity.
  - input:
      node: Call
      func:
        node: Name
        id: getattr
      args: $args
    when: '"getattr" not in shadowed and args | length in [2, 3] and args[1].__class__.__name__ != "Constant" and args[0] | kind == "entity" and (args | length == 2 or args[2].__class__.__name__ == "Constant" and args[2].value is none)'
    output: attribute
  # getattr(entity, "Attribute", default) of an IFC attribute: the kind of that attribute name in the schemas.
  - input:
      node: Call
      func:
        node: Name
        id: getattr
      args: $args
    when: args | length >= 2 and args[1].value is defined and args[1].value is string and args[1].value[:1].isupper() and args[1].value in attribute_kinds and args[0] | kind in ["entity", "unknown", "scalar", "attribute"]
    output: '{{ attribute_kinds[args[1].value] }}'
  # An IFC attribute of an entity of unknown class: the kind of that attribute name in the schemas.
  - input:
      node: Attribute
      attr: $attr
    when: attr[:1].isupper() and attr in attribute_kinds and node.value | kind in ["entity", "unknown", "scalar", "attribute"]
    output: '{{ attribute_kinds[attr] }}'
  - input: $value
    output: unknown
