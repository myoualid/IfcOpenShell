<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ifcopenshell — smoke example</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, sans-serif;
      line-height: 1.4;
    }
    body { margin: 1.5rem; max-width: 52rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1rem; opacity: 0.85; }
    button, input[type="file"] { margin: 0 0.5rem 0.75rem 0; }
    pre {
      white-space: pre-wrap;
      padding: 0.75rem 1rem;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 6px;
      background: color-mix(in srgb, currentColor 6%, transparent);
      min-height: 8rem;
    }
    .ok { color: #1a7f37; }
    .err { color: #cf222e; }
    a { color: inherit; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "ifcopenshell": "../../ifcopenshell-js/dist/index.js"
    }
  }
  </script>
</head>
<body>
  <p><a href="../index.html">← All chapters</a></p>
  <h1>ifcopenshell — smoke</h1>
  <p>
    Loads the built TypeScript wrappers + staged WASM. Create a tiny IFC4 model
    in memory, or open a local <code>.ifc</code> file.
  </p>
  <button id="create" type="button" disabled>Create demo IFC4 wall</button>
  <input id="file" type="file" accept=".ifc,application/octet-stream" disabled />
  <pre id="log">Initializing WASM…</pre>

  <script type="module">
    import ifcopenshell from 'ifcopenshell';

    const logEl = document.getElementById('log');
    const createBtn = document.getElementById('create');
    const fileInput = document.getElementById('file');

    function log(message, className = '') {
      logEl.textContent = message;
      logEl.className = className;
    }

    function summarize(model) {
      const walls = model.byType('IfcWall');
      try {
        const names = walls.map((wall) => wall.Name ?? '(unnamed)');
        return [
          `schema: ${model.schema}`,
          `IfcWall count: ${walls.length}`,
          `IfcWall names: ${names.join(', ') || '(none)'}`,
        ].join('\n');
      } finally {
        walls.forEach((wall) => wall.dispose());
      }
    }

    try {
      const wasmBase = new URL('../../ifcopenshell-wasm/wasm/', import.meta.url).href;
      await ifcopenshell.init({ wasmBase });
      log('Ready. Create a demo model or choose an .ifc file.', 'ok');
      createBtn.disabled = false;
      fileInput.disabled = false;
    } catch (error) {
      log(`init() failed:\n${error?.stack || error}`, 'err');
      throw error;
    }

    createBtn.addEventListener('click', async () => {
      createBtn.disabled = true;
      try {
        log('Creating IFC4 file…');
        const model = await ifcopenshell.file({ schema: 'IFC4' });
        try {
          const wall = model.createEntity('IfcWall', {
            GlobalId: ifcopenshell.guid.new(),
            Name: 'Demo Wall',
          });
          wall.dispose();
          log(summarize(model), 'ok');
        } finally {
          model.dispose();
        }
      } catch (error) {
        log(`create failed:\n${error?.stack || error}`, 'err');
      } finally {
        createBtn.disabled = false;
      }
    });

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      fileInput.disabled = true;
      try {
        log(`Opening ${file.name}…`);
        const bytes = new Uint8Array(await file.arrayBuffer());
        const model = await ifcopenshell.open(bytes, file.name);
        try {
          log(summarize(model), 'ok');
        } finally {
          model.dispose();
        }
      } catch (error) {
        log(`open failed:\n${error?.stack || error}`, 'err');
      } finally {
        fileInput.value = '';
        fileInput.disabled = false;
      }
    });
  </script>
</body>
</html>
