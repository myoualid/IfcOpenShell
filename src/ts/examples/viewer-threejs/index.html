      <h1>Chapter 5 — Load IFC geometry with Three.js</h1>
      <p>
        Tessellate with IfcOpenShell, convert detached <code>Mesh</code> snapshots to
        <code>THREE.Mesh</code>, recenter for large coordinates.
      </p>
      <p id="status">Starting…</p>
      <section class="example-code-panel">

      </section>
      <div class="viewport-wrap"><canvas id="viewport"></canvas></div>
      <p class="hint">Drag to orbit · scroll to zoom · geometry from <code>sample.ifc</code></p>
    </main>

    <script type="text/plain" id="ifc-source">import ifcopenshell from 'ifcopenshell';

await ifcopenshell.init({ wasmBase });
const model = await ifcopenshell.open(bytes, 'sample.ifc');

const settings = new ifcopenshell.geom.settings();
settings.set('weld-vertices', true);
settings.set('mesher-linear-deflection', 0.02);

const iter = ifcopenshell.geom.iterate(settings, model, {
  numThreads: 1,
  geometryLibrary: 'opencascade',
});
await iter.initialize();

for await (const mesh of iter) {
  // mesh.vertices / mesh.faces / mesh.transform / mesh.normals
  // → upload to THREE.BufferGeometry (see viewer.js)
}

iter.dispose();
settings.dispose();
model.dispose();</script>

    <script>
      (function () {
        function highlightIfcSource() {
          const source = document.getElementById('ifc-source');
          const code = document.querySelector('#example-code code');
          if (!source || !code || !window.hljs) return;
          code.textContent = source.textContent.trim();
          hljs.highlightElement(code);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', highlightIfcSource);
        } else {
          highlightIfcSource();
        }
      })();
    </script>
