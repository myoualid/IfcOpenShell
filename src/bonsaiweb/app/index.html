<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<title>Bonsai Web</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="apple-touch-icon" href="./files/favicon.png">
		<link rel="manifest" href="./manifest.json">
		<link rel="shortcut icon" href="./files/favicon_white.ico" media="(prefers-color-scheme: dark)"/>
		<link rel="shortcut icon" href="./files/favicon.ico" media="(prefers-color-scheme: light)" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@aeco-dev/gui@latest/gui.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@aeco-dev/layout@latest/layout.css">
		<link rel="stylesheet" href="./css/main.css">
		<script type="importmap">
			{
				"imports": {
					"ifcopenshell": "https://cdn.jsdelivr.net/npm/ifcopenshell@latest/dist/index.js",
					"ifcopenshell/geom": "https://cdn.jsdelivr.net/npm/ifcopenshell@latest/dist/geom/index.js",
					"ifcopenshell/util": "https://cdn.jsdelivr.net/npm/ifcopenshell@latest/dist/util/index.js",
					"@ifcopenshell/wasm": "https://cdn.jsdelivr.net/npm/@ifcopenshell/wasm@latest/browser.js",
					"@ifcopenshell/wasm/api": "https://cdn.jsdelivr.net/npm/@ifcopenshell/wasm@latest/wasm/ifcopenshell_api.mjs",
					"@aeco-dev/gui": "https://cdn.jsdelivr.net/npm/@aeco-dev/gui@latest/gui.js",
					"@aeco-dev/layout": "https://cdn.jsdelivr.net/npm/@aeco-dev/layout@latest/layout.js",
					"@ioai/wasm-zstd": "https://cdn.jsdelivr.net/npm/@ioai/wasm-zstd@latest/dist/index.js",
					"fzstd": "https://cdn.jsdelivr.net/npm/fzstd@latest/esm/index.mjs",
					"ifcviewer": "../src/viewer/host.js"
				}
			}
		</script>
	</head>
	<body>
		<script src="../vendor/@ifcopenshell/viewer/IfcViewerWeb.js"></script>
		<script>
			window.addEventListener( "error", ( event ) => {
				window.__bootError = event.message + " @ " + event.filename + ":" + event.lineno;
			} );
			window.addEventListener( "unhandledrejection", ( event ) => {
				const reason = event.reason;
				window.__bootError = reason && ( reason.stack || reason.message ) || String( reason );
			} );
		</script>
		<script type="module">
			import * as BonsaiWeb from "../build/bonsai.js";
			import { BonsaiWebConfiguration } from "./configuration/config.js";

			window.URL = window.URL || window.webkitURL;
			window.BlobBuilder = window.BlobBuilder || window.WebKitBlobBuilder || window.MozBlobBuilder;

			const bonsai = await BonsaiWeb.start( document.body, BonsaiWebConfiguration );
			window.bonsai = bonsai;
			bonsai.signals.appReady.add( ( payload ) => {
				console.log( "[bonsai] appReady", payload );
			} );
		</script>
	</body>
</html>
