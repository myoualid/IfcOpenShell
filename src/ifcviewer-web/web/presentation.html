<!DOCTYPE html>
<!-- This file was generated with the assistance of an AI coding tool. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IfcViewer (web) — presentation</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f1117; color: #c8ccd6;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #viewer-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #bar { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: #2d3748; color: #c8ccd6; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
  input[type=range] { width: 240px; }
  #msg { position: fixed; left: 12px; top: 12px; color: #8a93a6; }
</style>
</head>
<body>
<canvas id="viewer-canvas" width="1280" height="720"></canvas>
<div id="msg">Loading… (add ?model=URL to present your own .ifcview)</div>
<div id="bar">
  <button id="play">Play sequence</button>
  <button id="dolly">Dolly-zoom</button>
  <button id="spin">Turntable</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <button id="frames">Record PNG frames</button>
  <button id="webm">Record WebM</button>
</div>
<script src="IfcViewerWeb.js"></script>
<script src="ifcviewer.js"></script>
<script src="ifcviewer-presentation.js"></script>
<script>
(async function () {
  const msg = document.getElementById('msg');
  const canvas = document.getElementById('viewer-canvas');
  const viewer = await IfcViewer.create({ canvas: canvas, sidecarFormatVersion: 19 });
  await viewer.ready;
  const url = new URLSearchParams(location.search).get('model');
  if (url) await viewer.addUrl(url, { replace: true });
  const P = IfcViewerPresentation.attach(viewer);
  await P.frames(10);
  const home = P.camera();
  msg.textContent = 'Ready';

  // Long lens -> wide lens with the same framing: a dolly-zoom.
  const seq = P.sequence([
    { name: 'establish', duration: 4, camera: { fov: 8, keepFraming: true, pitch: 30 }, orbit: 25 },
    { name: 'dolly-zoom', duration: 3, camera: { fov: 75, keepFraming: true }, ease: 'inOutSine' },
    { name: 'rise', duration: 3, camera: { pitch: 60, fov: 40, keepFraming: true }, arc: 8, hold: 0.5 },
  ], { start: home });

  document.getElementById('play').onclick = function () { seq.reset(); P.play(seq); };
  document.getElementById('dolly').onclick = function () {
    const c = P.camera();
    P.flyTo({ fov: c.fov > 30 ? 8 : 70, keepFraming: true }, { duration: 2.5, ease: 'inOutSine' });
  };
  let stopSpin = null;
  document.getElementById('spin').onclick = function () {
    if (stopSpin) { stopSpin(); stopSpin = null; } else stopSpin = P.turntable({ degPerSec: 12 });
  };
  document.getElementById('scrub').oninput = function (e) {
    P.stop(); seq.seek(seq.duration * e.target.value / 1000);
  };
  document.getElementById('frames').onclick = async function () {
    const r = await P.recordFrames(seq, { fps: 24, width: 1920, height: 1080,
      onProgress: function (i, n) { msg.textContent = 'frame ' + i + ' / ' + n; } });
    msg.textContent = 'Saved ' + (r.frames || r.length) + ' frames';
  };
  document.getElementById('webm').onclick = async function () {
    const blob = await P.recordVideo(seq, { fps: 30 });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'sequence.webm' });
    a.click();
  };
})();
</script>
</body>
</html>
