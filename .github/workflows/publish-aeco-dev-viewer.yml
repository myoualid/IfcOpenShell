name: Publish @aeco-dev/viewer

# Builds ifcviewer-web from the fork's main branch, v0.9.0, packs the wasm
# next to ifcviewer.js, and publishes @aeco-dev/viewer. Features reach the
# package by being merged into that branch. The version is chosen here and is
# not committed back.
#
# Authentication: repository secret IFCVIEWER, an npm token that can publish
# the @aeco-dev scope. The build job does not use it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Pack and run npm publish --dry-run, without uploading"
        required: false
        type: boolean
        default: false

# The called build workflow cannot exceed these. contents: read is required
# for its checkout; id-token: write is what npm trusted publishing uses.
permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: publish-aeco-dev-viewer
  cancel-in-progress: false

jobs:
  branch:
    if: github.repository == 'myoualid/IfcOpenShell'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the release branch
        env:
          RELEASE_BRANCH: v0.9.0
        run: |
          if [ "$GITHUB_REF_NAME" != "$RELEASE_BRANCH" ]; then
            echo "::error::Packages are published from ${RELEASE_BRANCH}, the fork's main branch. Merge the feature there and dispatch this workflow on ${RELEASE_BRANCH}, not ${GITHUB_REF_NAME}."
            exit 1
          fi

  build:
    needs: branch
    if: github.repository == 'myoualid/IfcOpenShell'
    uses: ./.github/workflows/build-ifcviewer-web.yml

  publish:
    needs: build
    if: github.repository == 'myoualid/IfcOpenShell'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ifcviewer-web
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ifcviewer-web
          path: build-web

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pack @aeco-dev/viewer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/pack-aeco-viewer.py

      - name: Publish
        working-directory: src/ifcviewer-web/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.IFCVIEWER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The IFCVIEWER secret is empty. Add the npm token under Settings, Secrets and variables, Actions, secret name IFCVIEWER."
            exit 1
          fi
          echo "::add-mask::$NODE_AUTH_TOKEN"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi
