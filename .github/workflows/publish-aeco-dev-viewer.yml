name: Publish @aeco-dev/viewer

# Builds ifcviewer-web from the branch you dispatch, packs the wasm next to
# ifcviewer.js, and publishes @aeco-dev/viewer. The version is chosen here and
# is not committed back to the branch.
#
# Authentication, either one:
#   - Repository secret NPM_TOKEN: an npm Automation token that can publish
#     the @aeco-dev scope.
#   - npm trusted publishing for this repo and workflow, with no secret.
#     The job requests id-token: write for that path.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Pack and run npm publish --dry-run, without uploading"
        required: false
        type: boolean
        default: false

# The called build workflow cannot exceed these. contents: read is required
# for its checkout; id-token: write is what npm trusted publishing uses.
permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: publish-aeco-dev-viewer
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'myoualid/IfcOpenShell'
    uses: ./.github/workflows/build-ifcviewer-web.yml

  publish:
    needs: build
    if: github.repository == 'myoualid/IfcOpenShell'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ifcviewer-web
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ifcviewer-web
          path: build-web

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Pack @aeco-dev/viewer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/pack-aeco-viewer.py

      - name: Publish
        working-directory: src/ifcviewer-web/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is unset. Publishing with GitHub OIDC (npm trusted publishing)."
            echo "If @aeco-dev/viewer has no trusted publisher for this workflow, add an Automation token as the NPM_TOKEN secret."
            unset NODE_AUTH_TOKEN
            extra=(--provenance)
          else
            extra=()
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public "${extra[@]}"
          fi
